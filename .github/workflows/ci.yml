name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test-${{ matrix.lane }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [main, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run ${{ matrix.lane }} tests
        shell: pwsh
        run: npm run test:ci:${{ matrix.lane }} -- --report=.artifacts/ci/${{ matrix.lane }}.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.lane }}
          path: .artifacts/ci/${{ matrix.lane }}.xml
          if-no-files-found: warn

  bilibili-compose:
    name: bilibili-compose-runtime-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare production test environment
        shell: bash
        run: |
          cp .env.production.example .env.production
          sed -i 's/^TFT_AGENT_VISITOR_SECRET=.*/TFT_AGENT_VISITOR_SECRET=ci-only-visitor-secret-00000000000000000000/' .env.production
          sed -i 's/^TFT_AGENT_ADMIN_TOKEN=.*/TFT_AGENT_ADMIN_TOKEN=ci-only-admin-token-000000000000000000000/' .env.production
      - name: Parse production Compose topology
        run: docker compose config
      - name: Build final images without cache
        run: docker compose build --no-cache bilibili-mcp app
      - name: Start production services
        run: docker compose up -d postgres redis bilibili-mcp migrate app worker
      - name: Wait for Bilibili MCP protocol health
        shell: bash
        run: |
          for attempt in {1..60}; do
            container_id="$(docker compose ps -q bilibili-mcp)"
            status="$(docker inspect "$container_id" --format '{{.State.Health.Status}}' 2>/dev/null || true)"
            if [ "$status" = healthy ]; then exit 0; fi
            sleep 2
          done
          docker compose logs bilibili-mcp
          exit 1
      - name: Verify runtime isolation contract
        shell: bash
        run: |
          container_id="$(docker compose ps -q bilibili-mcp)"
          port_bindings="$(docker inspect "$container_id" --format '{{json .HostConfig.PortBindings}}')"
          if [ "$port_bindings" != null ] && [ "$port_bindings" != '{}' ]; then
            echo "Unexpected host port bindings: $port_bindings"
            exit 1
          fi

          mapfile -t networks < <(docker inspect "$container_id" | jq -r '.[0].NetworkSettings.Networks | keys[]')
          if [ "${#networks[@]}" -ne 1 ] || [[ "${networks[0]}" != *_bilibili_mcp ]]; then
            printf 'Unexpected sidecar networks: %s\n' "${networks[*]}"
            exit 1
          fi

          if docker inspect "$container_id" | jq -r '.[0].Config.Env[]' | grep -Eq '^(DATABASE_URL|REDIS_URL|TFT_AGENT_ADMIN_TOKEN|TFT_AGENT_VISITOR_SECRET|TFT_AGENT_LLM_API_KEY|TFT_AGENT_CONCLUSION_API_KEY)='; then
            echo 'Bilibili MCP received a forbidden production secret.'
            exit 1
          fi

          docker compose exec -T app node -e "if(process.env.BILIBILI_MCP_ENDPOINT!=='http://bilibili-mcp:3000/mcp') process.exit(1)"
          docker compose exec -T worker node -e "if(process.env.BILIBILI_MCP_ENDPOINT) process.exit(1)"
          docker compose run --rm migrate node -e "if(process.env.BILIBILI_MCP_ENDPOINT) process.exit(1)"
      - name: Run real MCP search and detail smoke
        run: docker compose exec -T app npm run smoke:bilibili:mcp:compose
      - name: Verify app survives an MCP outage
        shell: bash
        run: |
          docker compose exec -T app node -e "fetch('http://127.0.0.1:17317/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
          docker compose stop bilibili-mcp
          docker compose exec -T app node -e "fetch('http://127.0.0.1:17317/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
          docker compose start bilibili-mcp
          for attempt in {1..60}; do
            container_id="$(docker compose ps -q bilibili-mcp)"
            status="$(docker inspect "$container_id" --format '{{.State.Health.Status}}' 2>/dev/null || true)"
            if [ "$status" = healthy ]; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Re-run MCP smoke after recovery
        run: docker compose exec -T app npm run smoke:bilibili:mcp:compose
      - name: Show Compose logs
        if: always()
        run: docker compose logs --no-color
      - name: Tear down Compose
        if: always()
        run: docker compose down -v
