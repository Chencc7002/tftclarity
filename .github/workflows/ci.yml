name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test-${{ matrix.lane }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [main, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run ${{ matrix.lane }} tests
        shell: pwsh
        run: npm run test:ci:${{ matrix.lane }} -- --report=.artifacts/ci/${{ matrix.lane }}.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.lane }}
          path: .artifacts/ci/${{ matrix.lane }}.xml
          if-no-files-found: warn
