<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'self' blob:; object-src 'none'; base-uri 'none'">
  <title>TFTClarity 随身伙伴</title>
  <link rel="stylesheet" href="pet.css">
</head>
<body>
  <main>
    <button id="bubble" class="bubble hit" title="点击打开完整聊天"><span id="bubble-text">你好</span></button>
    <canvas id="pet" width="192" height="208" aria-label="角色：点击摸头，按住拖动"></canvas>
    <nav class="capsule hit" aria-label="桌宠操作">
      <button id="chat" title="输入消息" aria-label="输入消息">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 5H6a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-7"/><path d="m10 14 1-4L19 2a2.1 2.1 0 0 1 3 3l-8 8-4 1Z"/></svg>
      </button>
      <span class="divider" aria-hidden="true"></span>
      <button id="menu" title="更多操作 · 也可右键格温" aria-label="更多操作">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
      </button>
    </nav>
    <form id="composer" class="composer hit" hidden autocomplete="off">
      <button type="button" id="close-composer" title="收起输入框 · Esc" aria-label="收起输入框">×</button>
      <input id="message-input" aria-label="发给格温的消息" placeholder="和格温聊聊…" maxlength="8000">
      <button type="submit" id="send" aria-label="发送消息" title="发送 · Enter" disabled>↑</button>
    </form>
  </main>
  <script type="module" src="pet.mjs"></script>
</body>
</html>
