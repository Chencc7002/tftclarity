services:
  app:
    build: .
    restart: unless-stopped
    env_file: [.env.production]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 17317
      TFT_AGENT_PROCESS_ROLE: web
      TFT_AGENT_PERSISTENT_STORE: postgres
      TFT_AGENT_EPHEMERAL_STORE: redis
      TFT_AGENT_STORAGE_ALLOW_MEMORY_FALLBACK: "false"
      TFT_AGENT_SEMANTIC_INDEX_PATH: /app/.cache/semantic-index.sqlite
      BILIBILI_MCP_MODE: auto
      BILIBILI_MCP_TRANSPORT: streamable_http
      BILIBILI_MCP_ENDPOINT: http://bilibili-mcp:3000/mcp
      BILIBILI_MCP_TIMEOUT_MS: "8000"
      BILIBILI_SEARCH_RECALL_LIMIT: "10"
      BILIBILI_DETAIL_CANDIDATE_LIMIT: "5"
      BILIBILI_RESULT_LIMIT: "5"
      BILIBILI_MIN_CURRENT_RESULTS: "3"
      BILIBILI_PATCH_DISCOVERY_MODE: auto
      METATFT_PLAYER_MATCH_MCP_ENDPOINT: http://metatft-player-mcp:3010/mcp
    volumes: [tft_semantic:/app/.cache]
    expose: ["17317"]
    networks: [edge, backend, bilibili_mcp, player_match_mcp]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      embedding-model: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:17317/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    build: .
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    env_file: [.env.production]
    environment:
      NODE_ENV: production
      TFT_AGENT_PROCESS_ROLE: worker
      TFT_AGENT_PERSISTENT_STORE: postgres
      TFT_AGENT_EPHEMERAL_STORE: redis
      TFT_AGENT_STORAGE_ALLOW_MEMORY_FALLBACK: "false"
    networks: [backend]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  opgg-collector:
    build: .
    restart: unless-stopped
    command: ["npm", "run", "opgg:collect:watch"]
    env_file: [.env.production]
    volumes: [tft_semantic:/app/.cache]
    depends_on:
      app: { condition: service_healthy }

  migrate:
    build: .
    restart: "no"
    command: ["npm", "run", "db:migrate"]
    env_file: [.env.production]
    environment:
      NODE_ENV: production
      TFT_AGENT_PERSISTENT_STORE: postgres
      TFT_AGENT_EPHEMERAL_STORE: redis
      TFT_AGENT_STORAGE_ALLOW_MEMORY_FALLBACK: "false"
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: [.env.production]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/10-create-app-role.sh:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    env_file: [.env.production]
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\""]
    volumes: [redis_data:/data]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  embedding:
    image: ollama/ollama:0.32.5
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 24h
    volumes: [ollama_models:/root/.ollama]
    networks: [backend]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  embedding-model:
    image: ollama/ollama:0.32.5
    restart: "no"
    command: ["pull", "bge-m3"]
    environment:
      OLLAMA_HOST: http://embedding:11434
    networks: [backend]
    depends_on:
      embedding: { condition: service_healthy }
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  bilibili-mcp:
    build:
      context: .
      dockerfile: deploy/bilibili-mcp.Dockerfile
    restart: unless-stopped
    init: true
    environment:
      TRANSPORT: remote
      PORT: "3000"
    networks: [bilibili_mcp]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  metatft-player-mcp:
    build: .
    restart: unless-stopped
    init: true
    command: ["npm", "run", "metatft:player-mcp:http"]
    env_file: [.env.production]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3010"
    networks: [player_match_mcp]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: [.env.production]
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      app: { condition: service_healthy }

networks:
  edge:
  backend:
  bilibili_mcp:
  player_match_mcp:

volumes:
  postgres_data:
  redis_data:
  tft_semantic:
  ollama_models:
  caddy_data:
  caddy_config:
